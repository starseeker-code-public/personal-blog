<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title">
  <title id="title">Rust code: an async event consumer that retries every failure as a lesson learned</title>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a6b"/>
      <stop offset="0.55" stop-color="#1a1735"/>
      <stop offset="1" stop-color="#0f0d24"/>
    </linearGradient>
    <radialGradient id="amber-glow" cx="0.88" cy="0.08" r="0.65">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05040f" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="960" height="720" fill="url(#backdrop)"/>
  <rect width="960" height="720" fill="url(#amber-glow)"/>
  <rect width="960" height="720" fill="url(#violet-glow)"/>

  <!-- Editor window -->
  <rect x="56" y="72" width="848" height="576" rx="18" fill="#16132e" filter="url(#shadow)"/>
  <rect x="56.5" y="72.5" width="847" height="575" rx="17.5" fill="none" stroke="#3a3466"/>
  <circle cx="94" cy="106" r="8" fill="#ff5f57"/>
  <circle cx="122" cy="106" r="8" fill="#febc2e"/>
  <circle cx="150" cy="106" r="8" fill="#28c840"/>
  <text x="480" y="112" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#8b7db8">consumer.rs</text>
  <line x1="57" y1="140" x2="903" y2="140" stroke="#2d2855"/>

  <!-- The "lesson learned" line, highlighted -->
  <rect x="57" y="374" width="846" height="40" fill="#f59e0b" fill-opacity="0.09"/>
  <rect x="57" y="374" width="4" height="40" fill="#fbbf24"/>

  <!-- Code -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#ece8ff">
    <text x="96" y="225" fill="#8b7db8" font-style="italic">/// Mistakes are the path to mastery.</text>
    <text x="96" y="269"><tspan fill="#a78bfa">async</tspan> <tspan fill="#a78bfa">fn</tspan> <tspan fill="#fbbf24">consume</tspan><tspan fill="#9d93d1">(</tspan><tspan fill="#a78bfa">mut</tspan> queue<tspan fill="#9d93d1">:</tspan> <tspan fill="#7dd3fc">Queue</tspan><tspan fill="#9d93d1">&lt;</tspan><tspan fill="#7dd3fc">Event</tspan><tspan fill="#9d93d1">&gt;)</tspan> <tspan fill="#9d93d1">{</tspan></text>
    <text x="158" y="313"><tspan fill="#a78bfa">while</tspan> <tspan fill="#a78bfa">let</tspan> <tspan fill="#7dd3fc">Some</tspan><tspan fill="#9d93d1">(</tspan>event<tspan fill="#9d93d1">)</tspan> <tspan fill="#9d93d1">=</tspan> queue<tspan fill="#9d93d1">.</tspan><tspan fill="#fbbf24">next</tspan><tspan fill="#9d93d1">().</tspan><tspan fill="#a78bfa">await</tspan> <tspan fill="#9d93d1">{</tspan></text>
    <text x="220" y="357"><tspan fill="#a78bfa">if</tspan> <tspan fill="#a78bfa">let</tspan> <tspan fill="#7dd3fc">Err</tspan><tspan fill="#9d93d1">(</tspan>e<tspan fill="#9d93d1">)</tspan> <tspan fill="#9d93d1">=</tspan> <tspan fill="#fbbf24">handle</tspan><tspan fill="#9d93d1">(&amp;</tspan>event<tspan fill="#9d93d1">).</tspan><tspan fill="#a78bfa">await</tspan> <tspan fill="#9d93d1">{</tspan></text>
    <text x="282" y="401"><tspan fill="#f472b6">warn!</tspan><tspan fill="#9d93d1">(%</tspan>e<tspan fill="#9d93d1">,</tspan> <tspan fill="#9ece6a">"lesson learned"</tspan><tspan fill="#9d93d1">);</tspan></text>
    <text x="282" y="445">queue<tspan fill="#9d93d1">.</tspan><tspan fill="#fbbf24">retry</tspan><tspan fill="#9d93d1">(</tspan>event<tspan fill="#9d93d1">).</tspan><tspan fill="#a78bfa">await</tspan><tspan fill="#9d93d1">;</tspan></text>
    <text x="220" y="489" fill="#9d93d1">}</text>
    <text x="158" y="533" fill="#9d93d1">}</text>
    <text x="96" y="577" fill="#9d93d1">}</text>
  </g>
</svg>
