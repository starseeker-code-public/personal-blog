# Rendered when the container starts: the nginx image runs envsubst over
# /etc/nginx/templates (see the Dockerfile), filling in ${SEO_API_ORIGIN}, the
# backend, and ${NGINX_LOCAL_RESOLVERS}, the container's DNS servers.

# Crawlers don't run the app's JavaScript, so all they'd see of a page is
# index.html's default title and share card. The ones behind link previews
# (WhatsApp, Instagram, X, Telegram…) and search engines get index.html with
# the page's own <head> instead: /__crawler.html below. Everyone else gets
# index.html as it is.
map $http_user_agent $app_shell {
    default /index.html;

    # Facebook, Instagram, Messenger and Threads. iMessage's previews borrow the name.
    ~*(facebookexternalhit|facebot|meta-externalfetcher) /__crawler.html;
    # WhatsApp. Signal's previews borrow the name.
    ~*whatsapp /__crawler.html;
    # X, LinkedIn, Telegram, Discord, Slack, Teams and Skype, Pinterest, Reddit,
    # Mastodon, Bluesky, VK, KakaoTalk, and the embed services many apps use.
    ~*(twitterbot|linkedinbot|telegrambot|discordbot|slackbot|skypeuripreview|pinterestbot|pinterest\.com/bot|redditbot|mastodon|cardyb|vkshare|kakaotalk-scrap|embedly|iframely) /__crawler.html;
    # Search engines.
    ~*(googlebot|google-inspectiontool|bingbot|duckduckbot|applebot|yandexbot) /__crawler.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Look the backend up each time it's asked (cached a minute), not once at startup.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=60s ipv6=off;
    resolver_timeout 3s;

    # Never cache index.html — it's the entry point and must always be fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Serve SPA — all routes fall back to index.html ($app_shell: crawlers get
    # it with the page's <head> filled in)
    location = / {
        rewrite ^ $app_shell last;
    }

    location / {
        try_files $uri $uri/ $app_shell;
    }

    # index.html for crawlers. Its SSI include asks the backend for the page's <head>.
    location = /__crawler.html {
        internal;
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    # The <head> for index.html's include: /__seo/es/posts/x is the backend's
    # /seo/head/es/posts/x (app/routers/seo.py). Anything but a quick answer
    # leaves index.html's default <head> in place.
    location ^~ /__seo/ {
        internal;
        set $seo_api "${SEO_API_ORIGIN}";
        rewrite ^/__seo/(.*)$ /seo/head/$1 break;
        proxy_pass $seo_api;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 4s;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 400 401 403 404 405 408 422 429 500 502 503 504 = @no_page_head;
    }

    location @no_page_head {
        return 204;
    }

    # The sitemap comes from the backend but is published on the site's own
    # domain, where robots.txt points.
    location = /sitemap.xml {
        set $seo_api "${SEO_API_ORIGIN}";
        proxy_pass $seo_api;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
    }

    # Cache static assets aggressively (Vite adds content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
